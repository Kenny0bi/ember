name: gradient checks

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install numpy and CPU torch
        run: pip install numpy torch --index-url https://download.pytorch.org/whl/cpu
      - name: Run the gradient check suite (every op vs PyTorch)
        run: python tests/test_grads.py
