[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ember-autograd"
version = "0.1.0"
description = "A tensor autograd engine from scratch in NumPy, gradient-checked against PyTorch, that trains real transformers"
authors = [{ name = "Kenny Obidele" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["torch"]

[tool.setuptools]
packages = ["ember"]
